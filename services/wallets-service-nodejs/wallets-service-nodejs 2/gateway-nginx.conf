# Example side-by-side cutover (v1 -> v2)
# map old paths to the new v2 wallets service
upstream wallets_v2 { server 127.0.0.1:5002; }
server {
  listen 80;
  server_name localhost;
  location /api/v1/wallets/ {
    proxy_pass http://wallets_v2/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
